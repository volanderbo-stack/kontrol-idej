<!DOCTYPE html>
<html lang="uk" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контроль ідей</title>
<meta name="description" content="Проєкти, ідеї та фільтр «Чи дійсно потрібно?» — щоб не розпорошуватись.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ідеї">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7;--bg2:#f2f2f7;--card:#ffffff;--fill:rgba(118,118,128,.12);--text:#1c1c1e;--muted:#8a8a8e;
  --sep:rgba(60,60,67,.14);--blur:rgba(242,242,247,.82);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;--gray:#8e8e93;
  --accent:var(--blue);--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000;--bg2:#1c1c1e;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--text:#f2f2f7;--muted:#98989f;
  --sep:rgba(84,84,88,.6);--blur:rgba(22,22,24,.8);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--gray:#98989f;
  --shadow:none;color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#000000;--bg2:#1c1c1e;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--text:#f2f2f7;--muted:#98989f;
    --sep:rgba(84,84,88,.6);--blur:rgba(22,22,24,.8);
    --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--gray:#98989f;
    --shadow:none;color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
  font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* Шапка */
.top{position:sticky;top:0;z-index:20;background:var(--blur);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding:calc(env(safe-area-inset-top) + 8px) 16px 10px}
.top-inner{max-width:680px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.app-name{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:0;border-radius:12px;background:var(--fill);padding:10px 44px 10px 38px;font-size:16px;outline:none;min-height:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:18px}

main{max-width:680px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.03s}main.enter>*:nth-child(3){animation-delay:.06s}
main.enter>*:nth-child(4){animation-delay:.09s}main.enter>*:nth-child(5){animation-delay:.12s}
main.enter>*:nth-child(6){animation-delay:.15s}main.enter>*:nth-child(n+7){animation-delay:.18s}

/* Картки */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;transition:transform .2s}
.card h3{margin:8px 0 4px;font-size:19px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.desc{color:var(--muted);margin:0;font-size:15px;white-space:pre-line}
.card-top{display:flex;align-items:center;gap:8px;min-height:28px}
.card-top .end{margin-left:auto}
.small{font-size:13px}
.muted{color:var(--muted)}
.sec{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:24px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec:first-child{margin-top:4px}
.sec small{font-size:14px;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:14px;margin:-4px 4px 12px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:0;white-space:nowrap;line-height:1.3}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
button.pill{position:relative}
button.pill::after{content:"";position:absolute;inset:-9px -4px}
.c-blue{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.c-green{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.c-orange{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.c-red{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.c-purple{color:var(--purple);background:color-mix(in srgb,var(--purple) 14%,transparent)}
.c-teal{color:var(--teal);background:color-mix(in srgb,var(--teal) 15%,transparent)}
.c-gray{color:var(--gray);background:color-mix(in srgb,var(--gray) 16%,transparent)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--fill);color:var(--muted)}
.tag.proj{color:var(--text)}

.feats{list-style:none;margin:12px 0 0;padding:0;border-top:.5px solid var(--sep)}
.feats li{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.feats li.done span{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;position:relative;transition:.2s}
.check::after{content:"";position:absolute;inset:-10px}
.check.on{background:var(--green);border-color:var(--green)}
.x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:22px;width:44px;height:44px;flex:none}
.link{display:inline-block;margin-top:10px;font-size:14px;text-decoration:none;word-break:break-all;padding:6px 0}

.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:-8px -10px -8px auto;flex:none}
.icon-btn:active{background:var(--fill)}

/* Кнопки */
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;background:var(--fill);color:var(--accent);font-weight:600;font-size:16px;
  transition:transform .15s,opacity .15s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.25}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{font-size:14.5px;padding:8px 13px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.4;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.toolbar .wide{grid-column:1/-1}

/* Фільтри-чипи */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:4px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;border:0;border-radius:999px;padding:7px 14px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;font-weight:500;white-space:nowrap;transition:.2s;color:var(--text)}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip.on{background:var(--text);color:var(--bg)}
.chip b{font-weight:600;opacity:.55;margin-left:4px}
.tags .chip{box-shadow:none;background:var(--fill)}
.tags .chip.on{background:var(--accent);color:#fff}
.filters-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.filters-row select{flex:1}

/* Плитки */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.warn b{color:var(--orange)}

/* Бал */
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;height:54px;border-radius:16px;font-weight:700;font-size:21px;line-height:1;margin-left:auto;flex:none}
.score small{font-size:10.5px;font-weight:600;opacity:.75;margin-top:3px}
.warn-box{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,transparent);font-size:14px}
.rank{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}

/* Оцінювання */
.q-title{display:flex;gap:10px;font-weight:600;font-size:16px;margin-bottom:12px}
.q-n{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--muted);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:46px;border-radius:12px;border:0;background:var(--fill);font-weight:700;font-size:17px;transition:transform .2s cubic-bezier(.3,1.6,.6,1),background .2s,color .2s}
.scale button.on{background:var(--accent);color:#fff;transform:scale(1.05)}
.scale-labels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;padding:0 2px}
.total-card{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;
  background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:.5px solid var(--sep)}
.total-card{padding:12px 16px}
.total-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.total-num{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1}
.total-num small{font-size:16px;color:var(--muted);font-weight:600}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}

/* Рядки-списки */
.rows{margin:0;padding:0;list-style:none}
.rows li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--sep);min-height:52px}
.rows li:last-child{border-bottom:0}
.rows .grow{flex:1;min-width:0}
.rows .name{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:0;min-height:44px}

details.card>summary{font-weight:650;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .25s}
details.card[open]>summary::after{transform:rotate(90deg)}

/* Статистика */
.bar-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr 30px;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.bar-row b{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gap-mark{font-size:12px;font-weight:600;color:var(--orange)}

.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty .big{font-size:44px;margin-bottom:8px}
.empty p{margin:0 0 14px}

.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;font-size:32px;font-weight:300;line-height:1;z-index:25;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .2s}
.fab:active{transform:scale(.92)}

/* Нижнє меню */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--blur);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav-inner{display:flex;max-width:680px;margin:0 auto}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px 0;color:var(--muted);font-size:10.5px;font-weight:500;min-height:52px;position:relative;transition:color .2s}
.nav button.on{color:var(--accent)}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.6,1)}
.nav button.on svg{transform:scale(1.1)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}

/* Шторка */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:680px;max-height:92vh;background:var(--bg2);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-wrap.open .backdrop,.dlg-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 6px 20px}
.sheet-head h2{margin:0;font-size:20px;font-weight:700}
.sheet-head .icon-btn{margin:0;font-size:17px;color:var(--muted);background:var(--fill);width:32px;height:32px}
.sheet-head .icon-btn::after{content:"";position:absolute;inset:-6px}
.sheet-head .icon-btn{position:relative}
.sheet-body{overflow:auto;padding:8px 16px 22px;-webkit-overflow-scrolling:touch}

.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{position:relative;background:var(--card);border-radius:22px;max-width:400px;width:100%;padding:20px;max-height:86vh;overflow:auto;
  transform:scale(.9);opacity:0;transition:transform .28s cubic-bezier(.2,1.2,.4,1),opacity .2s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg-wrap.open .dlg{transform:none;opacity:1}
.dlg h2{margin:0 0 8px;font-size:19px;font-weight:700;text-align:center}
.dlg-body{font-size:15px;color:var(--muted);text-align:center}
.dlg-body p{margin:0 0 12px}
.dlg-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.dlg .rows li{text-align:left;color:var(--text)}

/* Поля */
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.input{width:100%;border:0;border-radius:12px;background:var(--card);padding:12px 14px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px var(--sep);min-height:46px;transition:box-shadow .2s}
.input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.input{resize:vertical;min-height:84px;line-height:1.4}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.inline{display:flex;gap:8px;margin-top:10px}
.inline .input{flex:1}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:15px;min-height:40px;transition:.2s}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.stack{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:rgba(28,28,30,.94);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);z-index:80;
  max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:600px){.top h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <div>
        <div class="app-name">Контроль ідей</div>
        <h1 id="title">Проєкти</h1>
      </div>
      <button class="icon-btn" data-act="settings" aria-label="Налаштування" style="margin:0 -10px 0 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Пошук по проєктах та ідеях" autocomplete="off" enterkeyhint="search">
      <button class="clear" data-act="clearSearch" aria-label="Очистити пошук" hidden>✕</button>
    </div>
  </div>
</header>

<main id="main"></main>

  'якого', 'якому', 'своїх', 'мене', 'мого', 'моїх', 'smart', 'with', 'днів', 'один', 'одна', 'одне', 'того', 'щоби', 'буде', 'дуже', 'всіх', 'усіх', 'цього', 'який', 'яка', 'які', 'якої', 'щоб']);

const SEED = [

  ['Розумний предмет «Менеджмент»', 'Курс менеджменту у форматі уроків', ['навчання', 'бізнес']],
  ['Ораторське мистецтво', 'Тренування виступів і впевненої мови', ['навчання', 'контент']],
  ['Гучність з навушників', 'Контроль гучності, щоб берегти слух', ["здоров'я"]],
  ['«Залишитися людиною» + гайди з ШІ', 'Знання про людяність і практичні гайди з ШІ', ['навчання']],
  ['Petit déjeuner (мережа пекарень)', 'Бізнес-план і облік мережі пекарень', ['бізнес']]
];

/* ============ Утиліти ============ */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const days = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 864e5));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
const uniq = a => [...new Set(a)];
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function verdictOf(total) {
  if (total >= 20) return {label: 'Робити зараз', c: 'green', state: 'прийнята'};
  if (total >= 13) return {label: 'Відкласти', c: 'orange', state: 'відкладена'};
  return {label: 'Відкинути', c: 'red', state: 'архів'};
}

/* ============ Дані ============ */
function seedData() {
  const t = now();
  return {
    version: VERSION,
    projects: SEED.map(([name, description, tags]) => ({id: uid(), name, description, status: 'ідея', tags, link: '', features: [], createdAt: t, statusChangedAt: t})),
    ideas: [], suggestions: [], dismissed: [],
    settings: {theme: 'auto', tab: 'projects'}
  };
}
function migrate(d) {
  if (!d || typeof d !== 'object') return seedData();
  // v1 — перша версія схеми; тут додаватимуться міграції для наступних версій
  d.projects = Array.isArray(d.projects) ? d.projects : [];
  d.ideas = Array.isArray(d.ideas) ? d.ideas : [];
  d.suggestions = Array.isArray(d.suggestions) ? d.suggestions : [];
  d.dismissed = Array.isArray(d.dismissed) ? d.dismissed : [];
  d.settings = Object.assign({theme: 'auto', tab: 'projects'}, d.settings);
  d.projects.forEach(p => {
    p.id = p.id || uid();
    p.name = String(p.name || 'Без назви');
    p.description = String(p.description || '');
    p.status = STATUSES.includes(p.status) ? p.status : 'ідея';
    p.tags = Array.isArray(p.tags) ? p.tags.map(String) : [];
    p.link = String(p.link || '');
    p.features = Array.isArray(p.features) ? p.features.filter(f => f && f.text) : [];
    p.createdAt = p.createdAt || now();
    p.statusChangedAt = p.statusChangedAt || p.createdAt;
  });
  d.ideas.forEach(i => {
    i.id = i.id || uid();
    i.title = String(i.title || 'Без назви');
    i.description = String(i.description || '');
    i.type = TYPE_META[i.type] ? i.type : 'нова';
    i.relatedProjectIds = Array.isArray(i.relatedProjectIds) ? i.relatedProjectIds : [];
    i.tags = Array.isArray(i.tags) ? i.tags : [];
    i.state = ['нова', 'прийнята', 'відкладена', 'архів', 'взято'].includes(i.state) ? i.state : 'нова';
    i.createdAt = i.createdAt || now();
  });
  d.version = VERSION;
  return d;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* пошкоджені дані — стартуємо заново */ }
  return seedData();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Не вдалося зберегти дані на пристрої'); }
}

let db = load();
save();
const ui = {tab: db.settings.tab || 'projects', q: '', status: 'all', tag: '', evalId: null, draft: {}, draftFor: null, copyText: ''};

const getP = id => db.projects.find(p => p.id === id);
const getI = id => db.ideas.find(i => i.id === id);
const activeProjects = () => db.projects.filter(p => p.status === 'в роботі');
const pausedLong = () => db.projects.filter(p => p.status === 'на паузі' && days(p.statusChangedAt) >= PAUSE_DAYS);
const pText = p => p.name + ' ' + p.description;

function setStatus(id, st) {
  const p = getP(id);
  if (!p || p.status === st) return;
  p.status = st;
  p.statusChangedAt = now();
  save();
}
function addFeature(p, text) {
  if (!p.features.some(f => f.text.toLowerCase() === text.toLowerCase())) p.features.push({text, done: false});
  save();
}

/* ============ Аналіз тексту ============ */
function tokens(text) { return String(text || '').toLowerCase().match(/[\p{L}\p{N}]+/gu) || []; }
function stems(text) {
  const s = new Set();
  for (const w of tokens(text)) {
    if (w.length < 4) continue;
    const st = w.slice(0, 5);
    if (!STOP_STEMS.has(st)) s.add(st);
  }
  return s;
}
function families(text) {
  const toks = tokens(text);
  return new Set(FAMILIES.filter(f => f.words.some(w => toks.some(t => t.startsWith(w)))).map(f => f.name));
}
function relation(tags, text, p) {
  const shared = tags.filter(t => p.tags.includes(t));
  const spec = shared.filter(t => !GENERIC_TAGS.includes(t));
  const a = stems(text), b = stems(pText(p));
  let st = 0; a.forEach(x => { if (b.has(x)) st++; });
  const fa = families(text), fb = families(pText(p));
  let fam = 0; fa.forEach(x => { if (fb.has(x)) fam++; });
  const union = new Set([...tags, ...p.tags]).size;
  const jac = union ? shared.length / union : 0;
  return {
    shared, spec, st, fam,
    score: fam * 3 + st * 2 + spec.length * 1.5 + shared.length * .5,
    similar: fam > 0 || st >= 2 || (spec.length > 0 && (st >= 1 || jac >= .5))
  };
}
function findSimilar(tags, text, excludeIds = []) {
  let best = null;
  for (const p of db.projects) {
    if (excludeIds.includes(p.id) || p.status === 'закрито') continue;
    const r = relation(tags, text, p);
    if (r.similar && (!best || r.score > best.score)) best = {p, score: r.score};
  }
  return best ? best.p : null;
}

/* ============ Генератор ідей ============ */
function goalCoverage() {
  const live = db.projects.filter(p => p.status !== 'закрито');
  return GOALS.map(g => ({...g, count: live.filter(p => p.tags.some(t => g.tags.includes(t))).length}));
}
function mergeClusters(live) {
  const parent = new Map(live.map(p => [p.id, p.id]));
  const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (let a = 0; a < live.length; a++) {
    for (let b = a + 1; b < live.length; b++) {
      const r = relation(live[a].tags, pText(live[a]), live[b]);
      if (r.fam > 0 || (r.spec.length && r.st > 0) || (r.shared.length >= 2 && r.spec.length)) parent.set(find(live[a].id), find(live[b].id));
    }
  }
  const groups = {};
  live.forEach(p => { (groups[find(p.id)] ||= []).push(p); });
  return Object.values(groups).filter(g => g.length >= 2).sort((a, b) => b.length - a.length).map(g => {
    g = g.slice(0, 4);
    const famCount = {};
    g.forEach(p => families(pText(p)).forEach(f => { famCount[f] = (famCount[f] || 0) + 1; }));
    let reason = Object.keys(famCount).filter(f => famCount[f] >= 2);
    if (!reason.length) reason = uniq(g.flatMap(p => p.tags)).filter(t => g.filter(p => p.tags.includes(t)).length >= 2 && !GENERIC_TAGS.includes(t));
    const n = g.length;
    return {
      key: 'merge:' + g.map(p => p.id).sort().join('+'),
      type: "об'єднання",
      title: "Об'єднати: " + g.map(p => p.name).join(' + '),
      description: `${n} ${plural(n, 'проєкт', 'проєкти', 'проєктів')} на одну тему${reason.length ? ' (' + reason.join(', ') + ')' : ''}. Один застосунок з модулями замість ${n} окремих: менше підтримки, більше користі щодня.`,
      relatedProjectIds: g.map(p => p.id),
      tags: uniq(g.flatMap(p => p.tags))
    };
  });
}
function improvementCandidates(live, known) {
  const out = [];
  const ordered = live.slice().sort(() => Math.random() - .5).sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]);
  for (const p of ordered) {
    const feats = uniq(p.tags.flatMap(t => FEATURE_LIB[t] || []));
    for (const f of feats) {
      const key = `imp:${p.id}:${f}`;
      if (known.has(key) || p.features.some(x => x.text.toLowerCase() === f.toLowerCase())) continue;
      out.push({
        key, type: 'покращення', feature: f,
        title: `${p.name}: ${f.charAt(0).toLowerCase() + f.slice(1)}`,
        description: `Функція, якої бракує в «${p.name}». Покращити те, що вже є, швидше й корисніше, ніж починати новий застосунок.`,
        relatedProjectIds: [p.id], tags: p.tags.slice()
      });
    }
  }
  // по одній функції на проєкт спочатку, щоб не було 5 покращень одного застосунку
  const firstPerProject = [], rest = [], seen = new Set();
  out.forEach(x => { const pid = x.relatedProjectIds[0]; if (seen.has(pid)) rest.push(x); else { seen.add(pid); firstPerProject.push(x); } });
  return firstPerProject.concat(rest);
}
function gapCandidates(known) {
  return goalCoverage().filter(g => g.count <= 1).sort((a, b) => a.count - b.count).flatMap(g =>
    (GAP_LIB[g.name] || []).map(x => ({
      key: 'gap:' + x.title, type: 'нова', title: x.title,
      description: `${x.description} Ціль «${g.name}» зараз покриває ${g.count} ${plural(g.count, 'проєкт', 'проєкти', 'проєктів')}.`,
      relatedProjectIds: [], tags: x.tags.slice()
    }))
  ).filter(x => !known.has(x.key));
}
function generate() {
  const known = new Set([...db.dismissed, ...db.ideas.map(i => i.key).filter(Boolean)]);
  const live = db.projects.filter(p => p.status !== 'закрито');
  const merges = mergeClusters(live).filter(m => !known.has(m.key));
  const imps = improvementCandidates(live, known);
  const gaps = gapCandidates(known);
  // пріоритет: об'єднання → покращення → нове
  const out = [...merges.slice(0, 2), ...imps.slice(0, 2), ...gaps.slice(0, 1)];
  const rest = [...merges.slice(2), ...imps.slice(2), ...gaps.slice(1)];
  while (out.length < 5 && rest.length) out.push(rest.shift());
  out.forEach(s => {
    s.similarTo = s.type === 'нова' ? (findSimilar(s.tags, s.title + ' ' + s.description)?.id || null) : null;
  });
  db.suggestions = out;
  save();
  return out.length;
}

  const tagRows = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxT = Math.max(1, ...tagRows.map(r => r[1]));

    <h2 class="sec">Найчастіші теги</h2>
    <section class="card">${tagRows.length ? tagRows.map(([t, c]) => bar('#' + esc(t), c, maxT, 'accent')).join('') : '<p class="muted">Тегів поки немає</p>'}</section>
    <h2 class="sec">Покриття цілей</h2>
    <p class="hint">Ціль з 0–1 проєктом — «дірка». Генератор пропонує ідеї саме туди.</p>
    <section class="card">${cov.map(g => bar(g.name, g.count, maxC, g.count <= 1 ? 'orange' : 'green', g.count <= 1 ? ' <span class="gap-mark">дірка</span>' : '')).join('')}</section>
    <h2 class="sec">Ідеї</h2>

      <li><span class="grow">Робити зараз</span><b>${n('прийнята')}</b></li>
      <li><span class="grow">Взято в роботу</span><b>${n('взято')}</b></li>

function updateTotal() {
  const el = $('#evalTotal');
  if (!el) return;
  const vals = QUESTIONS.map(q => ui.draft[q.k]).filter(Boolean);
  const total = vals.reduce((a, b) => a + b, 0);
  const complete = vals.length === QUESTIONS.length;
  el.textContent = total;
  const verdictEl = $('#evalVerdict'), bar = $('#evalBar');
  bar.style.width = (total / 25 * 100) + '%';
  if (complete) {
    const v = verdictOf(total);
    verdictEl.className = 'pill c-' + v.c;
    verdictEl.textContent = v.label;
    bar.style.background = `var(--${v.c})`;
  } else {
    verdictEl.className = 'pill c-gray';
    verdictEl.textContent = `${vals.length} з ${QUESTIONS.length}`;
    bar.style.background = 'var(--accent)';
  }
  $('#saveScoreBtn').disabled = !complete;
}

let pendingSlot = null;
function withSlot(exceptId, fn) {
  const active = activeProjects().filter(p => p.id !== exceptId);
  if (active.length < MAX_ACTIVE) { fn(); return; }
  pendingSlot = {exceptId, fn};
  dialog({
    title: `Вже ${active.length} проєкти в роботі`,
    html: `<p>Правило фокусу: не більше ${MAX_ACTIVE} одночасно. Щоб почати новий — постав один на паузу або заверши.</p>
      <ul class="rows">${active.map(p => `<li><span class="grow name">${esc(p.name)}</span>
        <button class="btn sm" data-act="slotSet" data-id="${p.id}" data-st="на паузі">Пауза</button>
        <button class="btn sm" data-act="slotSet" data-id="${p.id}" data-st="готово">Готово</button></li>`).join('')}</ul>`,
    buttons: [{label: 'Скасувати', cls: 'ghost', fn: () => { pendingSlot = null; }}]
  });
}
function changeStatus(id, st) {
  const p = getP(id);
  if (!p || p.status === st) return;
  const apply = () => { setStatus(id, st); render(); toast(`«${p.name}» → ${st}`); };
  if (st === 'в роботі') withSlot(id, apply); else apply();
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { /* немає доступу до буфера */ }
    ta.remove();
    return ok;
  }
}

function submitProject(f) {
  const fd = new FormData(f);
  const id = f.dataset.id;
  const data = {
    name: String(fd.get('name')).trim(),
    description: String(fd.get('description')).trim(),
    status: String(fd.get('status')),
    link: String(fd.get('link')).trim(),
    tags: pickedTags(f)
  };
  if (!data.name) { toast('Вкажи назву'); return; }
  const old = id ? getP(id) : null;
  const commit = () => {
    if (old) {
      if (old.status !== data.status) old.statusChangedAt = now();
      Object.assign(old, data);
    } else {
      db.projects.unshift({id: uid(), ...data, features: [], createdAt: now(), statusChangedAt: now()});

    save(); closeSheet(); render();
    toast(old ? 'Збережено' : 'Проєкт додано');
  };
  if (data.status === 'в роботі' && (!old || old.status !== 'в роботі')) withSlot(id || null, commit);
  else commit();
}

function normType(t) {
  t = String(t || '').toLowerCase();
  if (t.startsWith('покращ') || t.startsWith('improv')) return 'покращення';
  if (t.startsWith('об') || t.startsWith('merge') || t.startsWith('combin')) return "об'єднання";
  return 'нова';
}
function matchProject(name) {
  const n = String(name || '').toLowerCase().trim();
  if (!n) return null;
  return db.projects.find(p => p.name.toLowerCase() === n) ||
    (n.length >= 4 ? db.projects.find(p => { const pn = p.name.toLowerCase(); return pn.includes(n) || n.includes(pn); }) : null) || null;
}
function importAi(text) {
  const start = text.indexOf('['), end = text.lastIndexOf(']');
  if (start < 0 || end <= start) throw new Error('Не знайшов JSON-масиву [ … ] у тексті');
  let arr;
  try { arr = JSON.parse(text.slice(start, end + 1)); }
  catch (e) { throw new Error('JSON з помилкою: ' + e.message); }
  if (!Array.isArray(arr)) throw new Error('Очікувався масив ідей');
  const titles = new Set(db.ideas.map(i => i.title.toLowerCase()));
  let added = 0, skipped = 0;
  arr.forEach(x => {
    const title = String(x?.title || '').trim();
    if (!title || titles.has(title.toLowerCase())) { skipped++; return; }
    const rel = (Array.isArray(x.relatedProjects) ? x.relatedProjects : [x.relatedProjects]).map(matchProject).filter(Boolean);
    const relIds = uniq(rel.map(p => p.id));
    const type = normType(x.type);
    const description = String(x.description || '').trim();
    const tags = uniq(rel.flatMap(p => p.tags));
    const idea = {
      id: uid(), key: 'ai:' + title.toLowerCase(), title, description, type,
      relatedProjectIds: relIds, tags, scores: null, total: null, state: 'нова', source: 'ШІ', createdAt: now(),
      similarTo: type === 'нова' ? (findSimilar(tags, title + ' ' + description, relIds)?.id || null) : null
    };
    if (type === 'покращення' && relIds.length) idea.feature = title;
    db.ideas.unshift(idea);
    titles.add(title.toLowerCase());
    added++;
  });
  save();
  return {added, skipped};
}

/* ============ Дії з ідеями ============ */
function takeIdea(i) {
  const rel = i.relatedProjectIds.map(getP).filter(Boolean);
  if (i.type === 'покращення' && rel[0]) {
    const p = rel[0];
    const go = () => {
      addFeature(p, i.feature || i.title);
      setStatus(p.id, 'в роботі');
      i.state = 'взято'; i.projectId = p.id; save(); render();
      toast(`Функцію додано, «${p.name}» в роботі`);
    };
    if (p.status === 'в роботі') go(); else withSlot(p.id, go);
    return;
  }
  withSlot(null, () => {
    const isMerge = i.type === "об'єднання" && rel.length;
    const p = {
      id: uid(),
      name: isMerge ? rel.map(x => x.name.replace(/\s*\(.*?\)\s*/g, ' ').trim()).join(' + ') : i.title,
      description: i.description + (isMerge ? `\nОб'єднує: ${rel.map(x => x.name).join(', ')}` : ''),
      status: 'в роботі',
      tags: i.tags.length ? i.tags.slice() : uniq(rel.flatMap(x => x.tags)),
      link: '', features: [], createdAt: now(), statusChangedAt: now(),
      mergedFrom: isMerge ? rel.map(x => x.id) : undefined
    };
    db.projects.unshift(p);
    if (isMerge) rel.forEach(x => setStatus(x.id, 'закрито'));
    i.state = 'взято'; i.projectId = p.id; save(); render();
    toast(isMerge ? 'Новий проєкт в роботі, старі позначено «закрито»' : 'Проєкт створено і взято в роботу');
  });
}

  settings: settingsSheet,
  theme(id, el) {
    db.settings.theme = el.dataset.v; save(); applyTheme();
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
  },
  export() {
    const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kontrol-idej-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Резервну копію збережено');
  },
  import() { $('#importFile').value = ''; $('#importFile').click(); },
  reset() {
    confirmDlg('Скинути все?', 'Усі проєкти та ідеї буде замінено стартовим списком. Спершу зроби експорт, якщо дані потрібні.', 'Скинути', () => {
      const theme = db.settings.theme;
      db = seedData(); db.settings.theme = theme; save(); closeSheet(); render(true); toast('Скинуто до стартового списку');
    });
  },

  addProject() { projectForm(null); },
  editProject(id) { projectForm(getP(id)); },
  deleteProject(id) {
    const p = getP(id);
    confirmDlg('Видалити проєкт?', `«${esc(p.name)}» буде видалено. Якщо просто не працюєш над ним — краще статус «закрито».`, 'Видалити', () => {
      db.projects = db.projects.filter(x => x.id !== id);
      db.ideas.forEach(i => { i.relatedProjectIds = i.relatedProjectIds.filter(x => x !== id); if (i.similarTo === id) i.similarTo = null; });
      save(); closeSheet(); render(); toast('Проєкт видалено');
    });
  },
  statusMenu(id) {
    const p = getP(id);
    dialog({
      title: p.name,
      html: '<p>Новий статус</p>',
      buttons: [...STATUSES.filter(s => s !== p.status).map(s => ({label: s, fn: () => changeStatus(id, s)})), {label: 'Скасувати', cls: 'ghost'}]
    });
  },
  setStatusTo(id, el) { changeStatus(id, el.dataset.st); },
  slotSet(id, el) {
    setStatus(id, el.dataset.st);
    closeDialog();
    const ps = pendingSlot; pendingSlot = null;
    render();
    if (ps) setTimeout(() => withSlot(ps.exceptId, ps.fn), 260);
  },
  featToggle(id, el) { const f = getP(id).features[+el.dataset.i]; f.done = !f.done; save(); render(); },
  featDel(id, el) { getP(id).features.splice(+el.dataset.i, 1); save(); render(); },
  toggleTag(id, el) { el.classList.toggle('on'); },
  addCustomTag(id, el) {
    const inp = $('#newTag');
    const t = inp.value.trim().toLowerCase().replace(/^#/, '');
    if (!t) return;
    const pick = $('#tagPick');
    let chip = [...pick.querySelectorAll('.chip')].find(c => c.dataset.v === t);
    if (!chip) {
      pick.insertAdjacentHTML('beforeend', `<button type="button" class="chip on" data-act="toggleTag" data-v="${esc(t)}">#${esc(t)}</button>`);
    } else chip.classList.add('on');
    inp.value = '';
  },
  filterStatus(id, el) { ui.status = el.dataset.v; render(); },

  generate() {
    const n = generate();
    render(true);
    toast(n ? `${n} ${plural(n, 'пропозиція', 'пропозиції', 'пропозицій')}` : 'Нових ідей немає — оціни або відкинь наявні');
  },
  aiPrompt() { textSheet('Промпт для ШІ', aiPromptText(), 'Скопіюй і встав у Claude. Його відповідь (JSON) додай кнопкою «Відповідь ШІ».'); },
  aiPaste: aiPasteSheet,
  aiImport() {
    try {
      const {added, skipped} = importAi($('#aiJson').value);
      closeSheet(); render(true);
      toast(`Додано ${added}${skipped ? `, пропущено ${skipped} (дублікати)` : ''}. Оціни їх у «Фільтрі»`);
    } catch (e) { toast(e.message); }
  },
  async copyText() { toast(await copy(ui.copyText) ? 'Скопійовано' : 'Виділи текст і скопіюй вручну'); },
  addIdea: ideaForm,

  sugSave(key) {
    const s = db.suggestions.find(x => x.key === key);
    if (!s) return;
    db.ideas.unshift({...s, id: uid(), scores: null, total: null, state: 'нова', source: 'генератор', createdAt: now()});
    db.suggestions = db.suggestions.filter(x => x.key !== key);
    save(); render(); toast('Збережено — оціни у «Фільтрі»');
  },
  sugFeature(key) {
    const s = db.suggestions.find(x => x.key === key);
    if (!s) return;
    const p = getP(s.similarTo) || getP(s.relatedProjectIds[0]);
    addFeature(p, s.feature || s.title);
    db.dismissed.push(key);
    db.suggestions = db.suggestions.filter(x => x.key !== key);
    save(); render(); toast(`Додано як функцію до «${p.name}»`);
  },
  sugDismiss(key) {
    db.dismissed.push(key);
    db.suggestions = db.suggestions.filter(x => x.key !== key);
    save(); render();
  },
  ideaEval(id) {
    const i = getI(id);
    ui.evalId = id; ui.draft = {...(i.scores || {})}; ui.draftFor = id;
    ui.tab = 'filter'; ui.q = ''; $('#q').value = '';
    window.scrollTo({top: 0}); render(true);
  },
  score(id, el) {
    ui.draft[el.dataset.k] = +el.dataset.v;
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
    updateTotal();
  },
  saveScore(id) {
    const i = getI(id);
    const total = QUESTIONS.reduce((a, q) => a + (ui.draft[q.k] || 0), 0);
    const v = verdictOf(total);
    Object.assign(i, {scores: {...ui.draft}, total, verdict: v.label, state: v.state, scoredAt: now()});
    ui.evalId = null; ui.draft = {}; ui.draftFor = null;
    save(); window.scrollTo({top: 0}); render(true);
    toast(`${v.label} · ${total}/25${v.state === 'архів' ? ' — ідея в архіві' : ''}`);
  },
  ideaArchive(id) { getI(id).state = 'архів'; save(); render(); toast('Ідею перенесено в архів'); },
  ideaRestore(id) {
    Object.assign(getI(id), {state: 'нова', scores: null, total: null, verdict: null});
    save(); render(); toast('Ідея повернулась у чергу на оцінку');
  },
  ideaFeature(id) {
    const i = getI(id);
    const p = getP(i.similarTo) || getP(i.relatedProjectIds[0]);
    addFeature(p, i.feature || i.title);
    i.state = 'взято'; i.projectId = p.id;
    save(); render(); toast(`Додано як функцію до «${p.name}»`);
  },
  ideaTake(id) { takeIdea(getI(id)); },
  ideaSpec(id) { const i = getI(id); textSheet('ТЗ для Claude Code', makeSpec(i), 'Скопіюй і встав у Claude Code як завдання.'); },

  pauseContinue(id) { changeStatus(id, 'в роботі'); },
  pauseClose(id) { changeStatus(id, 'закрито'); },
  pauseLater(id) { getP(id).statusChangedAt = now(); save(); render(); toast(`Нагадаю через ${PAUSE_DAYS} днів`); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault();
  fn(el.dataset.id, el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'projForm') submitProject(e.target);
  else if (e.target.id === 'ideaForm') submitIdea(e.target);
});
document.addEventListener('change', e => {
  if (e.target.id === 'tagFilter') { ui.tag = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#dlgWrap').hidden) closeDialog();
    else if (!$('#sheetWrap').hidden) closeSheet();
  }
  if (e.key === 'Enter' && e.target.id === 'newTag') { e.preventDefault(); ACTIONS.addCustomTag(); }
});
let searchTimer;
$('#q').addEventListener('input', e => {
  $('.search .clear').hidden = !e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { ui.q = e.target.value; render(); }, 120);
});
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { toast('Файл не є коректним JSON'); return; }
    if (!data || !Array.isArray(data.projects) || !Array.isArray(data.ideas)) { toast('Це не резервна копія «Контролю ідей»'); return; }
    confirmDlg('Замінити всі дані?', `У файлі: ${data.projects.length} ${plural(data.projects.length, 'проєкт', 'проєкти', 'проєктів')}, ${data.ideas.length} ${plural(data.ideas.length, 'ідея', 'ідеї', 'ідей')}. Поточні дані буде замінено.`, 'Імпортувати', () => {
      db = migrate(data); save(); applyTheme(); closeSheet(); render(true); toast('Дані імпортовано');
    });
  };
  reader.readAsText(file);
});

function applyTheme() { document.documentElement.dataset.theme = db.settings.theme || 'auto'; }

applyTheme();
render(true);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
